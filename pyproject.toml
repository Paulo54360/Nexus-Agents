[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-agents"
version = "0.1.0"
description = "Self-hosted personal multi-agent AI platform (LangGraph, MCP, LiteLLM, Discord HITL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "discord.py>=2.4.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.30",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.3.0",
    "langfuse>=3.0.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "prometheus-client>=0.21.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
