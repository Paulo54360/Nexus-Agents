# ==============================================================================
# LiteLLM Hybrid Multi-Provider Free Cascade (0 EUR / mois)
# Architecture FinOps anti-429 :
#   - nexus-fast  (routage court)     -> Groq GPT-OSS 120B/20B (200ms) -> Mistral -> Gemini
#   - nexus-smart (outils & synthèses)-> Mistral Medium 3.5 (1B tokens/mois) -> Gemini -> Groq
# Séparer fast (Groq) et smart (Mistral) évite toute collision avec la limite 1 req/s de Mistral !
# ==============================================================================

model_list:
  # --- Fast / Routing (compact calls, ultra-fast on Groq) ---
  - model_name: nexus-fast
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: nexus-fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  # --- Smart / Tool Calling & French Synthesis (huge free quota on Mistral) ---
  - model_name: nexus-smart
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY

  # --- Fallback 1: Mistral 14B open-weight (independent model bucket) ---
  - model_name: fallback-mistral
    litellm_params:
      model: mistral/ministral-14b-latest
      api_key: os.environ/MISTRAL_API_KEY

  # --- Fallback 2: Google Gemini Free Tier ---
  - model_name: fallback-gemini
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: fallback-gemini
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # --- Fallback 3: Groq Open-Source ---
  - model_name: fallback-groq
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  allowed_fails: 2
  cooldown_time: 5
  timeout: 45
  fallbacks:
    - nexus-fast: ["fallback-gemini", "fallback-mistral"]
    - nexus-smart: ["fallback-gemini", "fallback-groq", "fallback-mistral"]

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
