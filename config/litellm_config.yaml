# ==============================================================================
# LiteLLM Hybrid Multi-Provider Free Cascade (0 EUR / mois)
# Priority:
#   1. Mistral Medium 3.5 (Free Experiment Tier — up to 1B free tokens/mo, great French & tool calling)
#   2. Google Gemini Free Tier (gemini-3.5-flash-lite / 3.1-flash-lite — rock-solid 56-tool MCP calling)
#   3. Groq Open-Source Free Tier (openai/gpt-oss-120b — native OpenAI JSON tool calling)
# ==============================================================================

model_list:
  # --- Primary Fast & Smart: Mistral Medium 3.5 (Free Experiment Tier) ---
  - model_name: nexus-fast
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: nexus-smart
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY

  # --- Fallback 1: Google Gemini Free Tier (handles 1 req/s bursts & 56 MCP tools flawlessly) ---
  - model_name: fallback-gemini
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: fallback-gemini
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # --- Fallback 2: Groq Open-Source Free Tier (GPT-OSS 120B, native JSON tool calling) ---
  - model_name: fallback-groq
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # --- Optional: Local Ollama on your Mac/PC over Tailscale ---
  # - model_name: nexus-local
  #   litellm_params:
  #     model: ollama_chat/qwen2.5:14b
  #     api_base: os.environ/OLLAMA_API_BASE

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 60
  timeout: 45
  fallbacks:
    - nexus-fast: ["fallback-gemini", "fallback-groq"]
    - nexus-smart: ["fallback-gemini", "fallback-groq"]

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
